<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Content Script 测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-box {
      border: 2px solid #4A90E2;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      background: #4A90E2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #3a7fca; }
    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
    }
    .success { border-left: 4px solid #67c23a; }
    .error { border-left: 4px solid #f56c6c; }
  </style>
</head>
<body>
  <h1>🧪 抖音 BGM 采集器 - Content Script 测试</h1>
  
  <div class="test-box">
    <h2>测试步骤</h2>
    <ol>
      <li>确保插件已安装并启用</li>
      <li>打开 <code>chrome://extensions/</code> 刷新插件</li>
      <li>回到本页面，刷新页面（F5）</li>
      <li>点击下面的测试按钮</li>
    </ol>
  </div>

  <div class="test-box">
    <h2>测试 1: Content Script 是否注入</h2>
    <p>打开 DevTools (F12) → Console，看看是否有 "[BGM Content] Content script loaded" 的日志</p>
    <div id="test1Result" class="result">等待测试...</div>
  </div>

  <div class="test-box">
    <h2>测试 2: 测试获取音乐 URL</h2>
    <p>测试 item_id: 7678189872561195782</p>
    <button onclick="testGetMp3()">开始测试</button>
    <div id="test2Result" class="result">点击按钮开始测试</div>
  </div>

  <script>
    // 检查 content script 是否注入
    window.addEventListener('load', () => {
      const result1 = document.getElementById('test1Result');
      // 延迟检查，给 content script 注入时间
      setTimeout(() => {
        if (window.contentScriptInjected) {
          result1.className = 'result success';
          result1.textContent = '✅ Content Script 已成功注入！';
        } else {
          result1.className = 'result error';
          result1.textContent = '❌ Content Script 未注入\n请检查插件是否正确安装，然后刷新本页面';
        }
      }, 500);
    });

    // 测试获取 MP3 URL
    async function testGetMp3() {
      const result2 = document.getElementById('test2Result');
      result2.textContent = '测试中...';
      result2.className = 'result';

      try {
        // 直接在页面上下文中调用 API（模拟 content script 的行为）
        const itemId = '7678189872561195782';
        const url = `https://www.douyin.com/aweme/v1/web/music/detail/?music_id=${itemId}`;
        
        const response = await fetch(url, {
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
        
        const text = await response.text();
        let resultText = `HTTP 状态: ${response.status}\n`;
        resultText += `Content-Type: ${response.headers.get('content-type')}\n\n`;
        
        if (response.status === 403) {
          result2.className = 'result error';
          resultText += '❌ 返回 403 错误\n\n';
          resultText += text.substring(0, 200);
        } else if (response.status === 200) {
          try {
            const data = JSON.parse(text);
            const mp3Url = data?.music_info?.play_url?.url_list?.[0];
            
            if (mp3Url) {
              result2.className = 'result success';
              resultText += '✅ 成功获取 MP3 URL!\n\n';
              resultText += `MP3 URL: ${mp3Url.substring(0, 100)}...\n\n`;
              resultText += JSON.stringify(data, null, 2).substring(0, 500);
            } else {
              result2.className = 'result error';
              resultText += '❌ API 返回成功，但没有 MP3 URL\n\n';
              resultText += JSON.stringify(data, null, 2).substring(0, 500);
            }
          } catch (e) {
            result2.className = 'result error';
            resultText += '❌ 解析 JSON 失败\n\n' + text.substring(0, 500);
          }
        } else {
          result2.className = 'result error';
          resultText += `❌ 意外的状态码: ${response.status}\n\n`;
          resultText += text.substring(0, 500);
        }
        
        result2.textContent = resultText;
      } catch (e) {
        result2.className = 'result error';
        result2.textContent = `❌ 请求失败:\n${e.message}\n${e.stack}`;
      }
    }
  </script>
</body>
</html>
