<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抖音BGM采集</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 320px;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #222;
    margin: 0;
    background: #fff;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 14px;
    color: #4A90E2;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row {
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 12px;
    margin-bottom: 4px;
    color: #666;
  }
  select {
    width: 100%;
    padding: 7px 8px;
    font-size: 13px;
    border: 1px solid #dcdfe6;
    border-radius: 4px;
    background: white;
    cursor: pointer;
  }
  select:focus {
    outline: none;
    border-color: #4A90E2;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #4A90E2;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #3a7fca; }
  button:disabled {
    background: #c0c4cc;
    cursor: not-allowed;
  }
  #status {
    margin-top: 12px;
    padding: 8px 10px;
    background: #f5f7fa;
    border-radius: 4px;
    font-size: 12px;
    color: #666;
    min-height: 18px;
    line-height: 1.5;
    word-break: break-all;
  }
  #status.error { background: #fef0f0; color: #c00; }
  #status.success { background: #f0f9eb; color: #67c23a; }
  .hint {
    margin-top: 8px;
    font-size: 11px;
    color: #999;
    text-align: center;
  }
  #openFolder {
    margin-top: 8px;
    background: transparent;
    color: #4A90E2;
    border: 1px solid #4A90E2;
    padding: 6px;
    font-size: 12px;
    display: none;
  }
  #openFolder:hover:not(:disabled) { background: #ecf5ff; }
</style>
</head>
<body>
<h1>🎵 抖音热门 BGM</h1>

<div class="row">
  <label>时间窗</label>
  <select id="timeFilter">
    <option value="1">最近 24 小时</option>
    <option value="2" selected>最近 7 天</option>
    <option value="3">最近 30 天</option>
  </select>
</div>

<div class="row">
  <label>数量</label>
  <select id="topN">
    <option value="10">前 10 首</option>
    <option value="20" selected>前 20 首</option>
    <option value="30">前 30 首</option>
  </select>
</div>

<button id="start">开始下载</button>
<button id="openFolder">打开下载文件夹</button>

<div id="status">选好参数点开始</div>

<div class="hint">MP3 会存到 Downloads / douyin-bgm /</div>

<script src="popup.js"></script>
</body>
</html>
